[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "roy-ayush22", email = "ayush30085@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.0",
    "fastapi[standard]>=0.143.5",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
rag-from-scratch = "rag_from_scratch:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
[tool.uv]
managed = true
package = false
